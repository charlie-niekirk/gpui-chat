[package]
name = "gpui-chat"
description = "Native Twitch chat client built on GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "gpui-chat"
path = "src/main.rs"

[dependencies]
gpui-chat-core = { workspace = true }
gpui-chat-settings = { workspace = true }
dirs = { workspace = true }
gpui-kit = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Headless GPUI windows and `TestAppContext` for the bridge tests: the same pinned GPUI snapshot
# `gpui-kit` re-exports, with its `test-support` feature (enabling that feature through
# `gpui-kit` does not resolve: it pulls in `gpui-fast`, which needs a `proptest` the index lacks).
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
tempfile = { workspace = true }
# `start_paused` virtual time for the firehose pacing tests.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
