[package]
name = "gpui-chat-twitch"
description = "Twitch IRC transport, Helix client and auth."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gpui-chat-core = { workspace = true }
futures-util = { workspace = true }
# `form` for the OAuth endpoints' urlencoded bodies.
reqwest = { workspace = true, features = ["form"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
twitch-irc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
