# cargo-deny configuration. Run with: cargo deny check
# Licenses: permissive only. Copyleft (GPL/AGPL/LGPL) is not allowed because
# gpui-chat is distributed as a single static binary under MIT.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Transitive crates (GPUI and friends) have unmaintained-advisory churn we cannot
# fix; only flag workspace-direct dependencies. Vulnerabilities always fail.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "OFL-1.1",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
