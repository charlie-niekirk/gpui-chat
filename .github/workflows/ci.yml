name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  # Full check on the primary platform: formatting, lints, all tests, release-shaped build.
  macos:
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Build
        run: cargo build --locked --workspace
      # The performance budgets that do not depend on the machine's speed (PR 6.1): an idle
      # window draws nothing and the 10 × 1 000 memory scenario stays under the 300 MB resident
      # budget with the image cache within its byte budget. Offline, synthetic images. The debug
      # build on the runner VM takes 3.5 to over 5 min for the memory scenario, so it gets 15
      # min (a timeout, not a budget).
      - name: Budgets (idle, memory)
        timeout-minutes: 35
        run: scripts/bench.sh --ci --no-build --bin target/debug/gpui-chat --only idle,memory --timeout 900

  # Everything except the GPUI app crate must build and pass on Linux
  # (cross-platform guardrail, see docs/ARCHITECTURE.md).
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test (all crates except the GPUI app)
        run: cargo test --locked --workspace --exclude gpui-chat

  # Licences, advisories, banned/duplicate crates and sources (deny.toml).
  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
